apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - daemonset.yaml
  # kubectl kustomize refuses to load files outside the deploy/ tree, and
  # controller-gen writes config/crd/ without a kustomization.yaml of its own,
  # so the CRDs are verbatim copies under deploy/crds/ instead of a ../
  # reference. Refresh with: cp config/crd/*.yaml deploy/crds/
  - crds

# The release workflow pins this image by digest with
# `kustomize edit set image ghcr.io/walzen-group/kuport-agent=...@sha256:...`;
# the name must stay in sync with the image in daemonset.yaml for that to match.
images:
  - name: ghcr.io/walzen-group/kuport-agent
    newTag: v0.1.0
