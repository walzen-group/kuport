  names:
    kind: Egress
    listKind: EgressList
    plural: egresses
    shortNames:
    - eg
    singular: egress
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.className
      name: CLASS
      type: string
    - jsonPath: .status.node
      name: NODE
      type: string
    - jsonPath: .spec.failClosed
