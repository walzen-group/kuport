# Verbatim copies of the CRDs generated under config/crd/. controller-gen owns
# the originals; refresh these with
#   cp config/crd/*.yaml deploy/crds/
# after `make manifests`, in the same commit that changes the API.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - kuport.dev_portmapclasses.yaml
  - kuport.dev_portmaps.yaml
