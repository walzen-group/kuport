---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: links.kuport.wlz.li
spec:
  group: kuport.wlz.li
  names:
    kind: Link
    listKind: LinkList
    plural: links
    singular: link
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.classKind
      name: KIND
      type: string
    - jsonPath: .spec.className
      name: CLASS
      type: string
    - jsonPath: .spec.peers
      name: PEERS
      type: string
    - jsonPath: .status.unusedSince
      name: UNUSED-SINCE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Link is one return link between two nodes, claimed from the cluster-wide pool.
          Its name, slot-<n>, fixes the link's VNI, addresses, packet mark, routing
          table and device name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LinkSpec names the class and the two nodes a return link connects. The slot
              is the object's name, slot-<n>, so the API server refuses a second claim on
              the same slot with AlreadyExists, cluster-wide and across every class.
            properties:
              classKind:
                enum:
                - PortMapClass
                - EgressClass
                type: string
              className:
                minLength: 1
                type: string
              peers:
                description: The two node names, sorted.
                items:
                  type: string
                maxItems: 2
                minItems: 2
                type: array
            required:
            - classKind
            - className
            - peers
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: LinkStatus records whether anything still needs the link.
            properties:
              unusedSince:
                description: |-
                  Set when no mapping or Egress needs this link. Any agent deletes the Link
                  once this is more than 24h old. Absent while the link is in use.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
