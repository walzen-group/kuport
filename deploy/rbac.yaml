# The agent reads its inputs and writes only its own status. Input reads go
# through the informer cache, so list and watch are the whole API surface for
# those kinds; get is granted only to the uncached cilium-config reader.
# Status writes are whole-subresource Updates, so update is the only verb the
# status rules need. There is no lease rule: kuport runs one independent agent
# per node and elects no leader.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuport-agent
  labels:
    app.kubernetes.io/name: kuport
    app.kubernetes.io/instance: kuport
rules:
  - apiGroups: ["kuport.wlz.li"]
    resources: ["portmapclasses"]
    verbs: ["list", "watch"]
  - apiGroups: ["kuport.wlz.li"]
    resources: ["portmapclasses/status"]
    verbs: ["update"]
  - apiGroups: ["kuport.wlz.li"]
    resources: ["portmaps"]
    verbs: ["list", "watch"]
  - apiGroups: ["kuport.wlz.li"]
    resources: ["portmaps/status"]
    verbs: ["update"]
  # Links are the cluster-wide pool of return-link slots. The agent holding a
  # pair's pod creates its Link, and any agent releases an unused one.
  - apiGroups: ["kuport.wlz.li"]
    resources: ["links"]
    verbs: ["list", "watch", "create", "delete"]
  - apiGroups: ["kuport.wlz.li"]
    resources: ["links/status"]
    verbs: ["update"]
  - apiGroups: ["kuport.wlz.li"]
    resources: ["egressclasses", "egresses"]
    verbs: ["list", "watch"]
  - apiGroups: ["kuport.wlz.li"]
    resources: ["egressclasses/status", "egresses/status"]
    verbs: ["update"]
  # An Egress selects pods by label, so every agent reads every pod's labels,
  # node and addresses; the agent's cache keeps only those fields.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  # The tunnel-mode host check reads one ConfigMap, kube-system/cilium-config.
  # A ClusterRole cannot scope by namespace, so resourceNames scopes the get to
  # that one name.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["cilium-config"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuport-agent
  labels:
    app.kubernetes.io/name: kuport
    app.kubernetes.io/instance: kuport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuport-agent
subjects:
  - kind: ServiceAccount
    name: kuport-agent
    namespace: kuport-system
---
# The built-in view, edit and admin ClusterRoles carry no rules of their own.
# Each is the union of every ClusterRole labelled for it, so a custom resource
# reaches them only when its own project ships a labelled role. Without these
# two, a subject bound to admin in its namespace can create Deployments and
# Services there and is refused a PortMap, which reads as a broken deployment
# rather than a missing rule.
#
# Egresses ride along: a namespace admin asks for an egress node the way it asks
# for a port, and the class's namespaceSelector decides whether it gets one.
#
# portmapclasses and egressclasses appear in neither. A class decides which
# nodes accept traffic or carry it out, on which interfaces and for which ports,
# so it stays with whoever administers the cluster. A namespace admin asks for a
# port or an egress; it does not set the terms.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuport-portmap-view
  labels:
    app.kubernetes.io/name: kuport
    app.kubernetes.io/instance: kuport
    rbac.authorization.k8s.io/aggregate-to-view: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-cluster-reader: "true"
rules:
  - apiGroups: ["kuport.wlz.li"]
    resources: ["portmaps", "portmaps/status", "egresses", "egresses/status"]
    verbs: ["get", "list", "watch"]
---
# The write verbs only. The read verbs arrive through the view role above, which
# aggregates into edit and admin as well.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuport-portmap-edit
  labels:
    app.kubernetes.io/name: kuport
    app.kubernetes.io/instance: kuport
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups: ["kuport.wlz.li"]
    resources: ["portmaps", "egresses"]
    verbs: ["create", "delete", "deletecollection", "patch", "update"]
