kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: portmapclasses.kuport.wlz.li
spec:
  group: kuport.wlz.li
  names:
    kind: PortMapClass
    listKind: PortMapClassList
    plural: portmapclasses
    shortNames:
    - pmc
    singular: portmapclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.returnPath.mode
      name: MODE
      type: string
    - jsonPath: .status.nodes[*].name
      name: NODES
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PortMapClass is the cluster-scoped, admin-authored definition of which nodes
          accept traffic for a set of mappings and how return traffic gets home.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PortMapClassSpec is the admin-authored definition of a class: which nodes
              accept traffic, on which interfaces, which ports may be asked for, which
              namespaces may ask, and how return traffic gets home.
            properties:
              namespaceSelector:
                description: Which namespaces may reference this class. Empty selects
                  every namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              nodes:
                additionalProperties:
                  description: NodeInterfaces is one accepting node's interface list.
                  properties:
                    interfaces:
                      description: |-
                        Interface names this node's DNAT rules match on. One rule per interface
                        per mapping. A PortMap narrows this set with its own interfaces field.
                      items:
                        type: string
                      minItems: 1
                      type: array
                  required:
                  - interfaces
                  type: object
                description: |-
                  Nodes that accept traffic for this class, keyed by node name. Each entry
                  names the interfaces that node's DNAT rules bind on, so nodes that carry
                  different NIC names belong to one class. A node absent here accepts
                  nothing for the class.
                minProperties: 1
                type: object
              ports:
                description: PortRange bounds the ports a PortMap in this class may
                  ask for.
                properties:
                  max:
                    default: 65535
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  min:
                    default: 1
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  reserved:
                    description: Ports the admin keeps back. A PortMap naming one
                      is rejected in status.
                    items:
                      format: int32
                      type: integer
                    type: array
                type: object
              returnPath:
                description: ReturnPath configures how return traffic reaches the
                  accepting node.
                properties:
                  mode:
                    description: None refuses any mapping whose pod is on another
                      node.
                    enum:
                    - Vxlan
                    - None
                    type: string
                  vxlan:
                    description: VxlanConfig sets the parameters of the VXLAN return
                      links this class builds.
                    properties:
                      port:
                        default: 4790
                        description: Must differ from the CNI's, which is 8472 for
                          Cilium.
                        format: int32
                        type: integer
                      subnet:
                        default: 169.254.77.0/24
                        description: Link addresses are allocated from here, a /31
                          per node pair.
                        type: string
                      vni:
                        default: 4242
                        format: int32
                        type: integer
                    type: object
                required:
                - mode
                type: object
              servingMode:
                default: Single
                description: How many of the class's accepting nodes program a mapping.
                enum:
                - Single
                - Multi
                type: string
            required:
            - nodes
            - returnPath
            type: object
          status:
            description: |-
              PortMapClassStatus records what each node's agent has done for this class and
              the return links allocated between node pairs.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              links:
                description: One entry per node pair that has, or recently had, a
                  return link.
                items:
                  description: |-
                    LinkAllocation is the recorded-claim allocation for one node pair's return
                    link, written by the agent holding a mapping's endpoint and read by the
                    accepting node's agent.
                  properties:
                    key:
                      description: The two node names joined by a slash, sorted. The
                        list map key.
                      type: string
                    peers:
                      description: The two node names, sorted.
                      items:
                        type: string
                      maxItems: 2
                      minItems: 2
                      type: array
                    slot:
                      description: |-
                        Zero-based index of this /31 within the class subnet. Fixes the routing
                        table id (200 + slot) and the packet mark (0x6b700000 | slot).
                      format: int32
                      type: integer
                    subnet:
                      description: The allocated /31 out of the class subnet.
                      type: string
                    unusedSince:
                      description: |-
                        Set when no PortMap needs this pair. The entry is dropped once this is
                        more than 24h old. Absent while the pair is in use.
                      format: date-time
                      type: string
                  required:
                  - key
                  - peers
                  - slot
                  - subnet
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              nodes:
                description: One row per node this class selects, maintained by that
                  node's agent.
                items:
                  description: |-
                    NodeStatus is one accepting node's readiness for this class, maintained by
                    that node's agent.
                  properties:
                    addresses:
                      additionalProperties:
                        type: string
                      description: |-
                        Addresses of this node's interfaces, keyed by interface name. Each
                        accepting agent fills it for the class's interfaces it can resolve, so
                        the agent that writes a PortMap's status can fill the published rows
                        naming this node. An interface with no resolvable address is absent.
                      type: object
                    linkMTU:
                      description: |-
                        UnderlayMTU minus the 50-byte VXLAN overhead, which is what this node's
                        own path allows. Each link device is set to the smaller of its two ends'
                        figures, so a link to a peer with a smaller underlay carries less than
                        this.
                      format: int32
                      type: integer
                    message:
                      description: Why the node is not ready, when it is not.
                      type: string
                    name:
                      type: string
                    ready:
                      type: boolean
                    underlayMTU:
                      description: MTU of the interface carrying the return links,
                        as read from the host.
                      format: int32
                      type: integer
                  required:
                  - name
                  - ready
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
